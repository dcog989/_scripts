name: dicmerge CI

on:
  push:
    branches: ["main"]
    paths: ["src/dicmerge/**", ".github/workflows/dicmerge-ci.yml"]
  pull_request:
    paths: ["src/dicmerge/**", ".github/workflows/dicmerge-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/dicmerge

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install dependencies
        run: uv sync --all-groups --locked
      # The justfile owns the lint set; running it here keeps CI and `just lint` from drifting.
      - name: Lint, format check and types
        run: just lint && just format-check

  test:
    name: Test (coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Test
        run: just test
