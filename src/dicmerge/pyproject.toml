[project]
name = "dicmerge"
version = "0.6.4"
description = "Scan, merge, and write back custom user dictionaries from multiple Linux applications"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
dicmerge = "dicmerge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN", "PERF", "SIM", "RUF", "S"]
allowed-confusables = ["✓", "⚠", "→", "—"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--cov=dicmerge", "--cov-report=term-missing"]
strict_markers = true

[tool.coverage.run]
source = ["dicmerge"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "ruff>=0.16.5",
    "types-PyYAML>=6.0",
]
